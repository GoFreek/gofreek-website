name: Remove public BITN launch copy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-bitn-public-copy.yml'

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch public BITN and ARIA copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          replacements = [
              ('Label Launch: BITN Records', 'Independent projects in development'),
              ('2026 Label Launch: BITN Records', 'Independent projects in development'),
              ('BITN RECORDS 2026', 'INDEPENDENT PROJECTS IN DEVELOPMENT'),
              ('BITN Records 2026', 'Independent projects in development'),
              ('Aug – Sep BITN Launch Berlin + Sydney', 'Studio and release development — Germany / Australia'),
              ('Aug–Sep BITN Launch Berlin + Sydney', 'Studio and release development — Germany / Australia'),
              ('BITN Launch Berlin + Sydney', 'Studio and release development — Germany / Australia'),
              ('#1 × 9 ARIA Club Chart Consecutive Weeks', '#1 ARIA Club Chart · 3 Consecutive Weeks'),
              ('#1 x 9 ARIA Club Chart Consecutive Weeks', '#1 ARIA Club Chart · 3 Consecutive Weeks'),
              ('nine consecutive weeks', 'three consecutive weeks'),
              ('9 consecutive weeks', '3 consecutive weeks'),
          ]

          for old, new in replacements:
              html = html.replace(old, new)

          html = re.sub(
              r'(<[^>]+>\s*)?Aug\s*[–-]\s*Sep\s*(</[^>]+>\s*)?BITN\s+Launch\s*(<[^>]+>\s*)?Berlin\s*\+\s*Sydney',
              'Studio and release development — Germany / Australia',
              html,
              flags=re.IGNORECASE,
          )

          html = re.sub(
              r'\b(Label\s+Launch:\s*)?BITN\s+Records\b(?:\s+2026)?',
              'Independent projects in development',
              html,
              flags=re.IGNORECASE,
          )

          html = re.sub(
              r'#1\s*[×x]\s*9\s*ARIA\s+Club\s+Chart\s+Consecutive\s+Weeks',
              '#1 ARIA Club Chart · 3 Consecutive Weeks',
              html,
              flags=re.IGNORECASE,
          )

          prohibited = [
              'Label Launch: BITN Records',
              '2026 Label Launch: BITN Records',
              'BITN RECORDS 2026',
              'BITN Launch Berlin + Sydney',
              '#1 × 9 ARIA Club Chart Consecutive Weeks',
              '#1 x 9 ARIA Club Chart Consecutive Weeks',
              'nine consecutive weeks',
          ]
          remaining = [term for term in prohibited if term.lower() in html.lower()]
          if remaining:
              raise SystemExit(f'Prohibited public copy remains: {remaining}')

          if html == original:
              raise SystemExit('No target copy was changed. Inspect index.html before merging.')

          if len(html) < len(original) * 0.95:
              raise SystemExit('Safety stop: patch removed too much content.')

          path.write_text(html, encoding='utf-8')
          print(f'Patched index.html: {len(original)} -> {len(html)} characters')
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/remove-bitn-public-copy.yml
          git config user.name "Go Freek Site Patch"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/remove-bitn-public-copy.yml
          git commit -m "Remove public BITN launch copy and correct ARIA claim"
          git push
