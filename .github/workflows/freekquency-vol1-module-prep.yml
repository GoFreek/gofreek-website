name: Prepare FREEKQUENCY Vol.1 module

on:
  push:
    branches:
      - freekquency-vol1-module-prep
    paths:
      - .freekquency-vol1-module.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: freekquency-vol1-module-prep

      - name: Apply bounded module patch
        run: python scripts/prepare_freekquency_vol1_module.py

      - name: Commit prepared source and remove one-shot tooling
        run: |
          rm -f .github/workflows/freekquency-vol1-module-prep.yml .freekquency-vol1-module.trigger scripts/prepare_freekquency_vol1_module.py
          git config user.name "FREEKQUENCY Control Room"
          git config user.email "gofreekdjs@gmail.com"
          git add -A
          git commit -m "Prepare FREEKQUENCY Vol.1 website module"
          git push origin HEAD:freekquency-vol1-module-prep
